# Shop view web server (nginx). Serves the page, the overlay's status.json and a
# same-origin pass-through to go2rtc (player files, still frames, MJPEG and the
# video websocket only; go2rtc's stream list, which contains the access codes, is
# not passed through). Runs with network_mode: host, so go2rtc is 127.0.0.1:1984.
upstream go2rtc { server 127.0.0.1:1984; }
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
    listen 8130;
    server_name _;
    root /www;
    access_log off;

    location = / { return 302 /shop; }
    location = /shop { try_files /shop.html =404; add_header Cache-Control "no-cache"; }
    location = /status.json { alias /overlay/status.json; add_header Cache-Control "no-store"; }

    location ~ ^/go2rtc/(video-stream\.js|video-rtc\.js)$ {
        proxy_pass http://go2rtc/$1;
    }
    location = /go2rtc/api/frame.jpeg {
        proxy_pass http://go2rtc/api/frame.jpeg$is_args$args;
    }
    location = /go2rtc/api/stream.mjpeg {
        proxy_pass http://go2rtc/api/stream.mjpeg$is_args$args;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location = /go2rtc/api/ws {
        proxy_pass http://go2rtc/api/ws$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;      # go2rtc checks the websocket Origin against Host
        proxy_read_timeout 1h;
        proxy_buffering off;
    }
    location / { return 404; }
}
